<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2533"/>
      <stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#00b8fc" stop-opacity="0.32"/>
      <stop offset="0.7" stop-color="#00b8fc" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#00b8fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5059"/>
      <stop offset="0.35" stop-color="#2a2e35"/>
      <stop offset="0.75" stop-color="#17191d"/>
      <stop offset="1" stop-color="#101214"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f4f7"/>
      <stop offset="0.28" stop-color="#a7b0ba"/>
      <stop offset="0.5" stop-color="#dde2e8"/>
      <stop offset="0.72" stop-color="#8d96a1"/>
      <stop offset="1" stop-color="#5d6570"/>
    </linearGradient>
    <linearGradient id="aluV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7580"/>
      <stop offset="0.3" stop-color="#d9dee4"/>
      <stop offset="0.55" stop-color="#9aa3ae"/>
      <stop offset="0.8" stop-color="#e6eaee"/>
      <stop offset="1" stop-color="#6d7580"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="0.5" stop-color="#15181c"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <radialGradient id="red" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff8a94"/>
      <stop offset="0.45" stop-color="#e8283a"/>
      <stop offset="1" stop-color="#8e0f1b"/>
    </radialGradient>
    <radialGradient id="blk" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5a616b"/>
      <stop offset="0.5" stop-color="#22262c"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3e8ee"/>
      <stop offset="1" stop-color="#8f98a4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="ledglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="sq"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="24" y="24" width="464" height="464" fill="url(#glow)"/>
    <ellipse cx="256" cy="452" rx="170" ry="26" fill="#000" opacity="0.55" filter="url(#soft)"/>
  </g>
  <rect x="25.5" y="25.5" width="461" height="461" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>

  <!-- spokes (under the rim) -->
  <path d="M100 234 C132 225 160 221 186 228 L192 306 C160 308 128 310 102 314 Z" fill="url(#alu)" stroke="#262b31" stroke-width="3"/>
  <path d="M412 234 C380 225 352 221 326 228 L320 306 C352 308 384 310 410 314 Z" fill="url(#alu)" stroke="#262b31" stroke-width="3"/>
  <path d="M108 233 C136 226 160 223 184 229" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5"/>
  <path d="M404 233 C376 226 352 223 328 229" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5"/>
  <path d="M224 340 L288 340 L279 420 Q256 428 233 420 Z" fill="url(#aluV)" stroke="#262b31" stroke-width="3"/>

  <!-- rim -->
  <circle cx="256" cy="262" r="168" fill="none" stroke="#0b0c0e" stroke-width="50"/>
  <circle cx="256" cy="262" r="168" fill="none" stroke="url(#leather)" stroke-width="42"/>
  <circle cx="256" cy="262" r="184" fill="none" stroke="#7a818b" stroke-width="2" stroke-dasharray="7 8" opacity="0.55"/>
  <circle cx="256" cy="262" r="152" fill="none" stroke="#7a818b" stroke-width="2" stroke-dasharray="7 8" opacity="0.45"/>
  <circle cx="256" cy="262" r="146" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="4"/>
  <path d="M124 156 A168 168 0 0 1 388 156" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="14" stroke-linecap="round" filter="url(#hl)"/>
  <!-- 12 o'clock marker -->
  <rect x="247" y="74" width="18" height="44" rx="5" fill="#00b8fc"/>
  <rect x="247" y="74" width="18" height="44" rx="5" fill="#00b8fc" filter="url(#ledglow)" opacity="0.6"/>

  <!-- hub -->
  <path d="M164 214 Q256 176 348 214 L360 302 Q344 358 256 366 Q168 358 152 302 Z" fill="url(#hub)" stroke="#3b424d" stroke-width="3"/>
  <path d="M176 222 Q256 192 336 222 L340 250 Q256 226 172 250 Z" fill="#ffffff" opacity="0.06"/>

  <!-- RPM LED bar -->
  <rect x="180" y="198" width="152" height="34" rx="13" fill="#050607" stroke="#2f353e" stroke-width="2"/>
  <g filter="url(#ledglow)">
    <rect x="189" y="207" width="10" height="16" rx="3" fill="#36e27a"/>
    <rect x="203" y="207" width="10" height="16" rx="3" fill="#36e27a"/>
    <rect x="217" y="207" width="10" height="16" rx="3" fill="#ffb21a"/>
    <rect x="231" y="207" width="10" height="16" rx="3" fill="#ffb21a"/>
    <rect x="245" y="207" width="10" height="16" rx="3" fill="#ff3b4e"/>
    <rect x="257" y="207" width="10" height="16" rx="3" fill="#ff3b4e"/>
    <rect x="271" y="207" width="10" height="16" rx="3" fill="#ffb21a"/>
    <rect x="285" y="207" width="10" height="16" rx="3" fill="#ffb21a"/>
    <rect x="299" y="207" width="10" height="16" rx="3" fill="#36e27a"/>
    <rect x="313" y="207" width="10" height="16" rx="3" fill="#36e27a"/>
  </g>

  <!-- buttons -->
  <circle cx="140" cy="256" r="14" fill="url(#red)" stroke="#4a0910" stroke-width="2.5"/>
  <circle cx="166" cy="284" r="10" fill="url(#blk)" stroke="#000" stroke-width="2"/>
  <circle cx="136" cy="290" r="10" fill="url(#blk)" stroke="#000" stroke-width="2"/>
  <circle cx="372" cy="256" r="14" fill="url(#red)" stroke="#4a0910" stroke-width="2.5"/>
  <circle cx="346" cy="284" r="10" fill="url(#blk)" stroke="#000" stroke-width="2"/>
  <circle cx="376" cy="290" r="10" fill="url(#blk)" stroke="#000" stroke-width="2"/>

  <!-- centre plate -->
  <rect x="212" y="274" width="88" height="46" rx="11" fill="#0a0b0d" stroke="#454c57" stroke-width="2.5"/>
  <text x="256" y="307" text-anchor="middle" fill="url(#plate)" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="27" letter-spacing="2">G27</text>
</svg>
